[build]
  command = "npm run verify:production-storage && npm run db:generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=0, must-revalidate"
